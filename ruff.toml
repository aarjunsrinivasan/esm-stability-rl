# Lint only — there is deliberately no formatter task. This codebase uses column
# alignment (`split_full            = pd.Series(...)`) and box-drawing section
# banners that `ruff format` would flatten.
line-length = 110          # p95 of the existing code is ~92; 110 covers the f-string tail
exclude = ["notebooks", ".pixi", "docs"]

[lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = [
    "E702",   # `a.append(x); b.append(y)` in the tight scoring loops is intentional
]

[lint.isort]
# `scoring` / `train_dpo` are imported bare (not as `align.scoring`) because the
# align/ scripts are run directly, with their own dir on sys.path. Naming them here
# keeps them in the first-party block instead of sorted in among third-party deps.
known-first-party = ["align", "data", "reward", "benchmark", "scoring", "train_dpo"]
